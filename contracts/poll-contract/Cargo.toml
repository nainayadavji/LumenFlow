[package]
name = "poll-contract"
version = "0.1.0"
edition = "2021"
description = "Live Poll — a Soroban smart contract that stores Yes/No votes on the Stellar network."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.0"

[dev-dependencies]
soroban-sdk = { version = "27.0.0", features = ["testutils"] }
# Pin ed25519-dalek to the 2.x line. soroban-env-host's `testutils` (used only
# by unit tests) requires `>=2.0.0`, but the just-released 3.0.0 changed the
# `rand_core::CryptoRng` API and fails to compile against the host. This exact
# pin forces the whole graph onto the compatible 2.x version.
ed25519-dalek = "=2.2.0"

# Optimised release profile recommended for Soroban Wasm builds: smallest
# possible binary while keeping arithmetic overflow checks on for safety.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
