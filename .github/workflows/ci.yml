name: Stellar dApp CI/CD Pipeline

on:
  push:
    branches: [ main, level-4-green-belt, level-3-orange-belt, level-2-yellow-belt ]
  pull_request:
    branches: [ main, level-4-green-belt, level-3-orange-belt ]

jobs:
  contract-tests:
    name: Soroban Smart Contract Tests & Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/poll-contract/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Soroban Contract Unit Tests
        run: |
          cd contracts/poll-contract
          cargo test --verbose
          cd ../payvault-contract
          cargo test --verbose

      - name: Build and Optimize Soroban WASM Contract
        run: |
          cd contracts/poll-contract
          cargo build --target wasm32v1-none --release
          cd ../payvault-contract
          cargo build --target wasm32v1-none --release
          
          # Copy release WASM directly (already optimized via profile settings in Cargo.toml)
          mkdir -p ../../build
          cp target/wasm32v1-none/release/payvault_contract.wasm ../../build/payvault_contract.optimized.wasm
          
      - name: Commit Optimized WASM back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/payvault_contract.optimized.wasm
          git diff-index --quiet HEAD || git commit -m "chore: upload compiled payvault_contract optimized WASM"
          git push

  frontend-checks:
    name: Frontend Lint, Type-check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript Type Check & Production Build
        run: npm run build

      - name: Check Production Bundle Artifacts
        run: test -d dist
