name: Stellar dApp CI/CD Pipeline

on:
  push:
    branches: [ main, level-3-orange-belt, level-2-yellow-belt ]
  pull_request:
    branches: [ main, level-3-orange-belt ]

jobs:
  contract-tests:
    name: Soroban Smart Contract Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/poll-contract/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Soroban Contract Unit Tests
        run: |
          cd contracts/poll-contract
          cargo test --verbose

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --features opt

      - name: Build Soroban WASM Contract
        run: |
          cd contracts/poll-contract
          stellar contract build

  frontend-checks:
    name: Frontend Lint, Type-check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Type Check
        run: npm run build

      - name: Check Production Bundle Artifacts
        run: test -d dist
